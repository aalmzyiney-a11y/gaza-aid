        function renderCards(filter = 'all', searchQuery = '') {
            const container = document.getElementById('cards-grid');
            container.innerHTML = '';

            const filteredData = aidLinksData.filter(item => {
                const matchesCategory = (filter === 'all') || (item.category === filter);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.subTitle.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 font-bold">لا توجد روابط مطابقة للبحث حالياً.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const tagsHTML = item.tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('');

                const cardHTML = `
                    <div class="aid-card p-5">
                        <div>
                            <!-- اسم الجهة بالعربي والإنكليزي -->
                            <div class="text-center mb-4 border-b border-slate-100 pb-3">
                                <h3 class="font-extrabold text-slate-900 text-base md:text-lg mb-1">${item.title}</h3>
                                <p class="text-xs text-slate-400 font-semibold tracking-wide">${item.subTitle}</p>
                            </div>

                            <!-- الوصف -->
                            <p class="text-xs text-slate-600 text-center leading-relaxed mb-4 min-h-[36px]">
                                ${item.desc}
                            </p>

                            <!-- الوسوم الدائرية -->
                            <div class="flex flex-wrap justify-center gap-1.5 mb-2">
                                ${tagsHTML}
                            </div>

                            <!-- صندوق قيمة المساعدة -->
                            <div class="value-box">
                                <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">قيمة المساعدة</span>
                                <span class="text-xs font-bold text-emerald-700">${item.value}</span>
                            </div>
                        </div>

                        <!-- زر التسجيل المباشر -->
                        <div class="pt-2">
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="register-btn shadow-sm">
                                <span>التسجيل المباشر</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        let currentFilter = 'all';
        function filterCategory(cat) {
            currentFilter = cat;
            renderCards(cat, document.getElementById('searchInput').value);
        }

        function searchCards() {
            renderCards(currentFilter, document.getElementById('searchInput').value);
        }

        window.onload = () => renderCards();
    </script>
</body>
</html>
